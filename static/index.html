<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.6rem; }
    form { display: flex; gap: .5rem; }
    input[type=url] { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 1rem; padding: .75rem; background: #eef8ee; border-radius: 4px; }
    .error { margin-top: 1rem; padding: .75rem; background: #fbeaea; color: #900; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
    td.url { word-break: break-all; }
    td.clicks, th.clicks { text-align: right; }
  </style>
</head>
<body>
  <h1>Link Shortener</h1>
  <form method="post" action="/shorten">
    <input type="url" name="url" placeholder="https://example.com/some/long/path" required>
    <button type="submit">Shorten</button>
  </form>
  {{if .ShortURL}}<p class="result">Short link: <a href="{{.ShortURL}}">{{.ShortURL}}</a></p>{{end}}
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  {{if .Links}}
  <table>
    <thead><tr><th>Short link</th><th>Original URL</th><th class="clicks">Clicks</th></tr></thead>
    <tbody>
    {{range .Links}}
      <tr>
        <td><a href="/{{.Code}}">{{$.BaseURL}}/{{.Code}}</a></td>
        <td class="url">{{.URL}}</td>
        <td class="clicks">{{.Clicks}}</td>
      </tr>
    {{end}}
    </tbody>
  </table>
  {{end}}
</body>
</html>
